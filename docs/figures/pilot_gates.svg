<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Each gate could stop the pilot; it stopped at Stage 2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="760" height="290" rx="10" fill="#ffffff"/>
  <text x="24" y="38" font-size="16" font-weight="600" fill="#1f2328">Each gate could stop the pilot; it stopped at Stage 2</text>

  <g fill="none" stroke="#8a8f98" stroke-width="1.25">
    <path d="M148 110H171" marker-end="url(#a)"/>
    <path d="M295 110H318" marker-end="url(#a)"/>
    <path d="M442 110H465" marker-end="url(#a)"/>
    <path d="M589 110H612" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M233 146V210" marker-end="url(#a)"/>
    <path d="M380 146V210" marker-end="url(#a)"/>
    <path d="M527 146V210" marker-end="url(#a)"/>
  </g>

  <rect x="24" y="74" width="124" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="86" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Freeze spec</text>
  <text x="86" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">hash the text</text>
  <text x="86" y="132" text-anchor="middle" font-size="11.5" fill="#59636e">v1.2, 27 Sep</text>

  <rect x="171" y="74" width="124" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="233" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Calibrate</text>
  <text x="233" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">synthetic only</text>
  <text x="233" y="132" text-anchor="middle" font-size="11.5" fill="#59636e">no real data</text>

  <rect x="318" y="74" width="124" height="72" rx="8" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Stage 1</text>
  <text x="380" y="116" text-anchor="middle" font-size="11.5" fill="#1f2328">CPU tests</text>
  <text x="380" y="132" text-anchor="middle" font-size="11.5" fill="#1f2328">PASS, 7 Oct</text>

  <rect x="465" y="74" width="124" height="72" rx="8" fill="#fbe9e9" stroke="#cf222e" stroke-width="2"/>
  <text x="527" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Stage 2</text>
  <text x="527" y="116" text-anchor="middle" font-size="11.5" fill="#1f2328">GPU validation</text>
  <text x="527" y="132" text-anchor="middle" font-size="11.5" fill="#1f2328">FAIL, Phase A</text>

  <rect x="612" y="74" width="124" height="72" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="674" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">Stage 3</text>
  <text x="674" y="116" text-anchor="middle" font-size="11.5" fill="#59636e">test, once</text>
  <text x="674" y="132" text-anchor="middle" font-size="11.5" fill="#59636e">never run</text>

  <text x="241" y="182" font-size="11.5" fill="#59636e">fail</text>
  <text x="388" y="182" font-size="11.5" fill="#59636e">fail</text>
  <text x="535" y="182" font-size="11.5" fill="#59636e">fail</text>

  <rect x="24" y="210" width="712" height="56" rx="8" fill="#f3f4f6" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="40" y="234" font-size="13" font-weight="600" fill="#1f2328">Fail at any gate: stop and record the failure</text>
  <text x="40" y="252" font-size="11.5" fill="#59636e">No re-tuning. Any change needs a dated, hashed amendment written before new data is read.</text>
</svg>
